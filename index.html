<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Anna University COE Notifications</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #172033;
    }

    header {
      background: #172554;
      color: white;
      padding: 28px 16px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      margin: 8px 0 0;
      opacity: 0.9;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px 15px;
    }

    .top-card {
      background: white;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px #0001;
    }

    .search {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
    }

    .notification {
      background: white;
      padding: 18px;
      margin: 14px 0;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0001;
    }

    .notification h2 {
      margin: 5px 0 8px;
      font-size: 18px;
    }

    .date {
      color: #667085;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .source {
      font-size: 12px;
      color: #777;
      margin-bottom: 12px;
      word-break: break-all;
    }

    .open-btn {
      display: inline-block;
      background: #172554;
      color: white;
      padding: 10px 15px;
      border-radius: 7px;
      text-decoration: none;
    }

    .new {
      display: inline-block;
      background: #dc2626;
      color: white;
      padding: 4px 8px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: bold;
    }

    .loading,
    .empty,
    .error {
      text-align: center;
      padding: 30px 15px;
      color: #667085;
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      color: #667085;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>🎓 Anna University COE</h1>
  <p>Controller of Examinations Notifications</p>
</header>

<div class="container">

  <div class="top-card">
    🔔 <strong>COE Notification Portal</strong>
    <br>
    <small>
      Automatically updated from the official Anna University COE website.
    </small>
  </div>

  <div class="top-card">
    <input
      id="search"
      class="search"
      type="search"
      placeholder="🔎 Search notifications..."
    >
  </div>

  <div id="status" class="top-card">
    🔄 Loading notifications...
  </div>

  <div id="notifications">
    <div class="loading">
      Loading latest COE notifications...
    </div>
  </div>

</div>

<footer>
  Independent notification portal<br>
  Official source:
  <a
    href="https://coe.annauniv.edu/home/index.php"
    target="_blank"
    rel="noopener"
  >
    Anna University COE
  </a>
</footer>

<script>

let allNotifications = [];

async function loadNotifications() {

  const status = document.getElementById("status");
  const container = document.getElementById("notifications");

  try {

    const response = await fetch(
      "data/notifications.json?t=" + Date.now()
    );

    if (!response.ok) {
      throw new Error("Unable to load notification data");
    }

    allNotifications = await response.json();

    status.innerHTML =
      "✅ <strong>" +
      allNotifications.length +
      "</strong> notifications available";

    displayNotifications(allNotifications);

  } catch (error) {

    console.error(error);

    status.innerHTML =
      "⚠️ Unable to load notifications";

    container.innerHTML = `
      <div class="error">
        Notification data is temporarily unavailable.<br><br>
        Please try again later.
      </div>
    `;
  }
}


function displayNotifications(items) {

  const container = document.getElementById("notifications");

  if (!items || items.length === 0) {

    container.innerHTML = `
      <div class="empty">
        📭 No notifications found.
      </div>
    `;

    return;
  }

  container.innerHTML = items.map((item, index) => {

    let displayTitle = item.title || "COE Notification";

if (
  displayTitle.toLowerCase() === "click here" &&
  item.url
) {
  const filename = item.url
    .split("/")
    .pop()
    .split("?")[0]
    .replace(/\.(pdf|docx?|xlsx?)$/i, "")
    .replace(/[_-]+/g, " ")
    .trim();

  if (filename) {
    displayTitle = filename
      .replace(/\b\w/g, letter => letter.toUpperCase());
  }
}

const title = escapeHtml(displayTitle);

    const url =
      escapeAttribute(item.url || "#");

    const date =
      escapeHtml(item.date || "Date not available");

    const latest =
      index === 0
        ? '<span class="new">LATEST</span>'
        : "";

    return `
      <div class="notification">

        ${latest}

        <h2>${title}</h2>

        <div class="date">
          📅 ${date}
        </div>

        <div class="source">
    📄 Official COE Notification
</div>
        <a
          class="open-btn"
          href="${url}"
          target="_blank"
          rel="noopener"
        >
          📄 Open Notification
        </a>

      </div>
    `;

  }).join("");
}


document.getElementById("search").addEventListener(
  "input",
  function () {

    const query =
      this.value.toLowerCase().trim();

    if (!query) {
      displayNotifications(allNotifications);
      return;
    }

    const filtered =
      allNotifications.filter(item =>
        JSON.stringify(item)
          .toLowerCase()
          .includes(query)
      );

    displayNotifications(filtered);
  }
);


function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function escapeAttribute(value) {

  return escapeHtml(value)
    .replaceAll("`", "&#096;");
}


loadNotifications();

</script>

</body>
</html>

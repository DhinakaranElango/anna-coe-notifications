name: Check Anna University COE

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  check-coe:

    runs-on: ubuntu-latest

    steps:

      # ==============================
      # CHECKOUT
      # ==============================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ==============================
      # PYTHON
      # ==============================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      # ==============================
      # DEPENDENCIES
      # ==============================

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4


      # ==============================
      # RUN COE CHECKER
      # ==============================

      - name: Check COE website
        run: |
          python checker.py


      # ==============================
      # CREATE JAVASCRIPT DATA FILE
      #
      # This makes the webpage able to
      # load notifications without depending
      # on a fetch request.
      # ==============================

      - name: Create notification JavaScript data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          json_file = Path("data/notifications.json")
          js_file = Path("data/notifications.js")

          data = json.loads(
              json_file.read_text(encoding="utf-8")
          )

          js_file.write_text(
              "window.COE_NOTIFICATIONS = "
              + json.dumps(
                  data,
                  ensure_ascii=False,
                  separators=(",", ":")
              )
              + ";\n",
              encoding="utf-8"
          )

          print(
              f"Created notifications.js "
              f"with {len(data)} notifications"
          )
          PY


      # ==============================
      # DETECT NEW / UPDATED
      # ==============================

      - name: Detect new and updated COE notifications
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

        run: |

          python - <<'PY'

          import json
          import subprocess
          import os


          # --------------------------------
          # OLD DATA FROM GITHUB
          # --------------------------------

          try:

              old_data = subprocess.check_output(
                  [
                      "git",
                      "show",
                      "HEAD:data/notifications.json"
                  ],
                  text=True
              )

              old_items = json.loads(old_data)

          except Exception:

              print(
                  "No previous notification database found."
              )

              old_items = []


          # --------------------------------
          # NEW DATA
          # --------------------------------

          with open(
              "data/notifications.json",
              "r",
              encoding="utf-8"
          ) as f:

              new_items = json.load(f)


          if not isinstance(old_items, list):
              old_items = []


          if not isinstance(new_items, list):
              new_items = []


          # --------------------------------
          # INDEX BY URL
          # --------------------------------

          old_by_url = {
              item.get("url"): item
              for item in old_items
              if item.get("url")
          }


          new_by_url = {
              item.get("url"): item
              for item in new_items
              if item.get("url")
          }


          new_notifications = []
          updated_notifications = []


          # --------------------------------
          # DETECT NEW / UPDATED
          # --------------------------------

          for url, new_item in new_by_url.items():

              # NEW PDF / URL
              if url not in old_by_url:

                  new_notifications.append(
                      new_item
                  )

                  continue


              old_item = old_by_url[url]


              fields_to_compare = [

                  "title",
                  "date",
                  "text",
                  "description",
                  "content",
                  "notice",
                  "notification"

              ]


              changed = False


              for field in fields_to_compare:

                  old_value = old_item.get(field)
                  new_value = new_item.get(field)


                  if old_value != new_value:

                      changed = True

                      print(
                          f"Updated field detected: "
                          f"{field} for {url}"
                      )


              if changed:

                  updated_notifications.append(
                      new_item
                  )


          # --------------------------------
          # SUMMARY
          # --------------------------------

          print(
              f"New notifications: "
              f"{len(new_notifications)}"
          )


          print(
              f"Updated notifications: "
              f"{len(updated_notifications)}"
          )


          # --------------------------------
          # NTFY TOPIC
          # --------------------------------

          topic = os.environ.get(
              "NTFY_TOPIC",
              ""
          ).strip()


          if not topic:

              print(
                  "NTFY_TOPIC secret is not configured."
              )

          else:

              # ==========================
              # NEW NOTIFICATIONS
              # ==========================

              for item in new_notifications:

                  title = (
                      item.get("title")
                      or item.get("notification")
                      or "New COE Notification"
                  )


                  url = item.get("url")


                  if not url:
                      continue


                  message = (

                      "🎓 Anna University COE\n\n"

                      "🆕 NEW NOTIFICATION\n\n"

                      f"📢 {title}\n\n"

                      "📄 Open Notification:\n"

                      f"{url}"

                  )


                  subprocess.run(

                      [
                          "curl",
                          "-sS",
                          "-X",
                          "POST",

                          "-H",
                          "Title: 🆕 New COE Notification",

                          "-H",
                          "Priority: 4",

                          "-H",
                          "Tags: graduation_cap,new",

                          "-H",
                          f"Click: {url}",

                          f"https://ntfy.sh/{topic}",

                          "-d",
                          message
                      ],

                      check=True

                  )


              # ==========================
              # UPDATED NOTIFICATIONS
              # ==========================

              for item in updated_notifications:

                  title = (
                      item.get("title")
                      or item.get("notification")
                      or "COE Notification Updated"
                  )


                  url = item.get("url")


                  if not url:
                      continue


                  message = (

                      "🎓 Anna University COE\n\n"

                      "🔄 NOTIFICATION UPDATED\n\n"

                      f"📢 {title}\n\n"

                      "✏️ The notification information "
                      "has been updated.\n\n"

                      "📄 Open Notification:\n"

                      f"{url}"

                  )


                  subprocess.run(

                      [
                          "curl",
                          "-sS",
                          "-X",
                          "POST",

                          "-H",
                          "Title: 🔄 COE Notification Updated",

                          "-H",
                          "Priority: 4",

                          "-H",
                          "Tags: graduation_cap,arrows_counterclockwise",

                          "-H",
                          f"Click: {url}",

                          f"https://ntfy.sh/{topic}",

                          "-d",
                          message
                      ],

                      check=True

                  )


          PY


      # ==============================
      # COMMIT DATABASE + JS DATA
      # ==============================

      - name: Commit updated notification data
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            data/notifications.json \
            data/notifications.js


          if git diff --cached --quiet; then

            echo "No notification changes."

          else

            git commit \
              -m "Update COE notifications"

            git push

          fi
